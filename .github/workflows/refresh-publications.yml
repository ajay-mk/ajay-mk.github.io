name: Refresh publications
on:
  schedule:
    - cron: '0 6 1 * *'   # 06:00 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write
  actions: write # dispatch the deploy workflow

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run fetch:pubs
        env:
          ORCID_ID: '0000-0002-0079-5443'
      - name: Commit changes if any
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git diff --quiet src/data/publications.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/data/publications.json
            git commit -m "publications: monthly refresh"
            git push
            # Pushes made with GITHUB_TOKEN don't trigger other workflows,
            # but a workflow_dispatch does, so start the deploy explicitly.
            gh workflow run deploy.yml --ref "${{ github.ref_name }}"
          else
            echo "no publication changes"
          fi
